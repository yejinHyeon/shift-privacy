<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>카카오톡으로 초대 보내기</title>
<script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.2/kakao.min.js" crossorigin="anonymous"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #fff; color: #191919;
         font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
  main { width: 100%; max-width: 360px; padding: 24px; text-align: center; }
  .msg { font-size: 15px; color: #555; margin: 0 0 20px; }
  .kakao { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 52px; border: 0; border-radius: 12px;
           background: #FEE500; color: rgba(0,0,0,0.85); font: inherit; font-size: 16px; font-weight: 600; cursor: pointer; }
  .kakao svg { width: 20px; height: 20px; }
  .copy { margin-top: 16px; background: none; border: 0; color: #888; font: inherit; font-size: 13px; text-decoration: underline; cursor: pointer; }
</style>
</head>
<body>
<main>
  <p class="msg" id="msg">카카오톡으로 초대를 보내요</p>
  <button class="kakao" id="send">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#000" d="M12 3C6.48 3 2 6.54 2 10.9c0 2.8 1.86 5.26 4.66 6.66l-.95 3.5c-.08.3.26.54.52.37l4.16-2.76c.53.07 1.07.1 1.61.1 5.52 0 10-3.54 10-7.9S17.52 3 12 3z"/></svg>
    카카오톡으로 보내기
  </button>
  <button class="copy" id="copy">카카오톡이 안 열리면 초대 문구 복사</button>
</main>
<script>
  var q = new URLSearchParams(location.search);
  var KAKAO_JS_KEY = '90bc85e28512244eb08e74e52ff5617d';
  var team = (q.get('team') || '').slice(0, 40);
  var code = (q.get('code') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);
  var base = location.origin + location.pathname.replace(/share\.html$/, '');
  var joinUrl = base + 'join.html?code=' + encodeURIComponent(code) + '&team=' + encodeURIComponent(team);
  var msg = document.getElementById('msg');

  try { if (window.Kakao && !Kakao.isInitialized()) Kakao.init(KAKAO_JS_KEY); } catch (e) {}

  function send() {
    if (!code) { msg.textContent = '초대코드가 없어요. 앱에서 다시 눌러주세요'; return; }
    if (!window.Kakao || !Kakao.isInitialized()) { msg.textContent = '카카오톡을 불러오지 못했어요. 아래에서 문구를 복사해주세요'; return; }
    Kakao.Share.sendDefault({
      objectType: 'feed',
      content: {
        title: (team || '우리') + ' 팀에 초대합니다',
        description: '초대코드 ' + code + ' · 시프트 앱에서 입력하면 바로 참여해요',
        imageUrl: base + 'share-card.png',
        imageWidth: 1024,
        imageHeight: 500,
        link: { mobileWebUrl: joinUrl, webUrl: joinUrl }
      },
      buttons: [{ title: '참여하기', link: { mobileWebUrl: joinUrl, webUrl: joinUrl } }]
    });
  }

  document.getElementById('send').onclick = send;
  document.getElementById('copy').onclick = function () {
    var text = '[시프트] ' + (team || '우리') + ' 팀에 초대합니다.\n시프트 앱에서 초대코드 ' + code + ' 를 입력하면 바로 참여할 수 있어요.\n' + joinUrl;
    navigator.clipboard.writeText(text).then(function () { msg.textContent = '복사했어요. 카카오톡 대화방에 붙여넣어 보내주세요'; },
      function () { msg.textContent = '초대코드: ' + code; });
  };

  // 폰에서는 이 화면을 거치지 않고 바로 카카오톡 공유를 연다 (컴퓨터는 창 차단 때문에 버튼을 눌러야 함)
  if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
    msg.textContent = '카카오톡을 여는 중이에요…';
    setTimeout(send, 150);
  }
</script>
</body>
</html>
