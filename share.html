<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>시프트 초대 보내기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.2/kakao.min.js" crossorigin="anonymous"></script>
<style>
  :root { --text: #191F28; --text2: #6B7684; --accent: #3182F6; --surface: #F5F7FA; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fff; color: var(--text); font-family: 'Pretendard Variable', Pretendard, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
  main { width: 100%; max-width: 400px; padding: 32px 20px; text-align: center; }
  .logo { width: 56px; height: 56px; border-radius: 16px; background: var(--accent); color: #fff; font-weight: 700; font-size: 30px; display: grid; place-items: center; margin: 0 auto 18px; }
  h1 { font-size: 21px; margin: 0 0 6px; }
  p { color: var(--text2); font-size: 15px; margin: 0 0 22px; line-height: 1.6; }
  .code { background: var(--surface); border-radius: 14px; padding: 16px; font-size: 28px; font-weight: 700; letter-spacing: 6px; margin-bottom: 22px; }
  button { width: 100%; border: 0; border-radius: 14px; padding: 16px; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer; }
  .kakao { background: #FEE500; color: #191600; margin-bottom: 10px; }
  .copy { background: var(--surface); color: var(--text); }
  .note { font-size: 13px; margin-top: 14px; min-height: 20px; }
</style>
</head>
<body>
<main>
  <div class="logo">시</div>
  <h1 id="title">팀원 초대하기</h1>
  <p>카카오톡으로 초대 카드를 보내면<br />받은 사람이 코드로 바로 참여할 수 있어요</p>
  <div class="code" id="code">------</div>
  <button class="kakao" id="send">카카오톡으로 보내기</button>
  <button class="copy" id="copy">초대 문구 복사</button>
  <p class="note" id="note"></p>
</main>
<script>
  var q = new URLSearchParams(location.search);
  // 키 두 개 중 어느 것이 되는지 시험할 수 있게 (?key=2)
  var KAKAO_JS_KEY = q.get('key') === '2' ? '90bc85e28512244eb08e74e52ff5617d' : '7c9ab182249294b1ee94d0c68f8e6400';
  var team = (q.get('team') || '').slice(0, 40);
  var code = (q.get('code') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);
  var base = location.origin + location.pathname.replace(/share\.html$/, '');
  var joinUrl = base + 'join.html?code=' + encodeURIComponent(code) + '&team=' + encodeURIComponent(team);
  var note = document.getElementById('note');

  document.getElementById('code').textContent = code || '------';
  if (team) document.getElementById('title').textContent = team + ' 팀원 초대하기';

  try { if (window.Kakao && !Kakao.isInitialized()) Kakao.init(KAKAO_JS_KEY); } catch (e) {}

  document.getElementById('send').onclick = function () {
    if (!code) { note.textContent = '초대코드가 없어요. 앱에서 다시 눌러주세요'; return; }
    if (!window.Kakao || !Kakao.isInitialized()) { note.textContent = '카카오톡 공유를 불러오지 못했어요. 아래 복사하기를 써주세요'; return; }
    Kakao.Share.sendDefault({
      objectType: 'feed',
      content: {
        title: '시프트 · ' + (team || '우리') + ' 팀에 초대합니다',
        description: '초대코드 ' + code + ' · 시프트 앱에서 코드를 입력하면 바로 참여해요',
        imageUrl: base + 'share-card.png',
        imageWidth: 1024,
        imageHeight: 500,
        link: { mobileWebUrl: joinUrl, webUrl: joinUrl }
      },
      buttons: [{ title: '초대코드로 참여하기', link: { mobileWebUrl: joinUrl, webUrl: joinUrl } }]
    });
  };

  document.getElementById('copy').onclick = function () {
    var text = '[시프트] ' + (team || '우리') + ' 팀에 초대합니다.\n시프트 앱에서 초대코드 ' + code + ' 를 입력하면 바로 참여할 수 있어요.\n' + joinUrl;
    navigator.clipboard.writeText(text).then(function () { note.textContent = '복사했어요. 카카오톡 대화방에 붙여넣어 보내주세요'; },
      function () { note.textContent = '복사하지 못했어요. 코드를 직접 알려주세요: ' + code; });
  };
</script>
</body>
</html>
